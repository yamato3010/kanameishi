[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kanameishi"
version = "0.1.0"
description = "強震モニタ TUI - ターミナルで動くリアルタイム地震情報モニター"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["earthquake", "tui", "terminal", "japan", "p2pquake", "eew"]
classifiers = [
    "Environment :: Console",
    "Natural Language :: Japanese",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "textual>=0.79.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
]

[project.urls]
Homepage = "https://github.com/yamato3010/kanameishi"
Repository = "https://github.com/yamato3010/kanameishi"
Changelog = "https://github.com/yamato3010/kanameishi/blob/main/CHANGELOG.md"

[project.scripts]
kaname = "kanameishi.__main__:main"
