[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "earthquake-tui"
version = "0.1.0"
description = "強震モニタ TUI - ターミナルで動くリアルタイム地震情報モニター"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "textual>=0.79.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
]

[project.scripts]
earthquake-tui = "earthquake_tui.__main__:main"
